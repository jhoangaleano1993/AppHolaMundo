trigger:
  branches:
    include:
      - main
      - dev
  tags:
    include:
      - v*
  paths:
    exclude:
      - README.md
      - docs/*

resources:
  repositories:
    - repository: templates
      type: github
      name: jhoangaleano1993/AzureDevOpsTemplate
      ref: refs/heads/dev
      endpoint: AzureDevOpsTemplate

pool:
  name: Default

variables:
  - name: imageName
    value: 'app-hola-mundo'
  - name: dockerfilePath
    value: '$(Build.SourcesDirectory)/Dockerfile'
  - name: kubernetesServiceConnection
    value: 'eks-cluster-connection'
  - group: AWS-Credentials
  - group: AWS-ECR
  - group: SonarCloud-Shared
  - group: SonarCloud-AppHolaMundo

stages:
  - stage: Build
    displayName: 'Build and Test'
    jobs:
      - job: BuildAndTest
        displayName: 'Build, Test and Analyze'
        steps:
          - bash: |
              if [[ "$(Build.SourceBranch)" == refs/tags/v* ]]; then
                VERSION=$(echo "$(Build.SourceBranch)" | sed 's|refs/tags/||')
                echo "##vso[task.setvariable variable=imageTag;isOutput=true]${VERSION}"
                echo "##vso[task.setvariable variable=isRelease;isOutput=true]true"
                echo "Building release version: ${VERSION}"
              else
                VERSION=$(cat package.json | grep '"version"' | sed 's/.*"version": "\([^"]*\)".*/\1/')
                echo "##vso[task.setvariable variable=imageTag;isOutput=true]${VERSION}-build.$(Build.BuildId)"
                echo "##vso[task.setvariable variable=packageVersion;isOutput=true]${VERSION}"
                echo "##vso[task.setvariable variable=isRelease;isOutput=true]false"
                echo "Building version: ${VERSION}-build.$(Build.BuildId)"
              fi
            name: setVersion
            displayName: 'Set Version Tag'

          - template: templates/build-steps.yml@templates
            parameters:
              nodeVersion: '20.x'

          - template: templates/test-steps.yml@templates
            parameters:
              testCommand: 'npm run test:coverage'
              publishTestResults: true

          - template: templates/sonar-analysis.yml@templates
            parameters:
              sonarProjectKey: '$(SONAR_PROJECT_KEY)'
              sonarOrganization: '$(SONAR_ORGANIZATION)'

          - task: PublishPipelineArtifact@1
            displayName: 'Publish Kubernetes Manifests'
            inputs:
              targetPath: '$(Build.SourcesDirectory)/k8s'
              artifact: 'k8s'
              publishLocation: 'pipeline'

  - stage: ContainerBuild
    displayName: 'Build and Push Container'
    dependsOn: Build
    condition: succeeded()
    variables:
      imageTag: $[ stageDependencies.Build.BuildAndTest.outputs['setVersion.imageTag'] ]
    jobs:
      - job: Docker
        displayName: 'Build and Push Docker Image'
        steps:
          - bash: |
              echo "Image Tag: $(imageTag)"
            displayName: 'Show Image Tag'

          - template: templates/docker-build.yml@templates
            parameters:
              imageName: '$(imageName)'
              dockerfilePath: '$(dockerfilePath)'
              awsRegion: '$(AWS_REGION)'
              ecrRegistry: '$(ECR_REGISTRY)'
              tags:
                - '$(imageTag)'
                - '$(Build.SourceBranchName)'
                - 'latest'

  - stage: DeployDev
    displayName: 'Deploy to Development'
    dependsOn: ContainerBuild
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/dev'))
    variables:
      imageTag: $[ stageDependencies.Build.BuildAndTest.outputs['setVersion.imageTag'] ]
    jobs:
      - deployment: DeployToEKS
        displayName: 'Deploy to Development EKS'
        environment: 'Development'
        strategy:
          runOnce:
            deploy:
              steps:
                - template: templates/k8s-deploy.yml@templates
                  parameters:
                    kubernetesServiceConnection: '$(kubernetesServiceConnection)'
                    namespace: 'dev'
                    manifests: |
                      $(Pipeline.Workspace)/k8s/deployment.yaml
                      $(Pipeline.Workspace)/k8s/service.yaml
                    imageName: '$(ECR_REGISTRY)/$(imageName):$(imageTag)'

                - template: templates/connectivity-test.yml@templates
                  parameters:
                    kubernetesServiceConnection: '$(kubernetesServiceConnection)'
                    namespace: 'dev'
                    serviceName: 'app-hola-mundo-service'
                    servicePort: 80
                    healthEndpoint: '/health'
                    maxRetries: 5
                    retryDelay: 10

  - stage: DeployQA
    displayName: 'Deploy to QA'
    dependsOn: ContainerBuild
    condition: and(succeeded(), startsWith(variables['Build.SourceBranch'], 'refs/heads/release/'))
    variables:
      imageTag: $[ stageDependencies.Build.BuildAndTest.outputs['setVersion.imageTag'] ]
    jobs:
      - deployment: DeployToEKSQA
        displayName: 'Deploy to QA EKS'
        environment: 'QA'
        strategy:
          runOnce:
            deploy:
              steps:
                - template: templates/k8s-deploy.yml@templates
                  parameters:
                    kubernetesServiceConnection: '$(kubernetesServiceConnection)'
                    namespace: 'qa'
                    manifests: |
                      $(Pipeline.Workspace)/k8s/deployment.yaml
                      $(Pipeline.Workspace)/k8s/service.yaml
                    imageName: '$(ECR_REGISTRY)/$(imageName):$(imageTag)'

                - template: templates/connectivity-test.yml@templates
                  parameters:
                    kubernetesServiceConnection: '$(kubernetesServiceConnection)'
                    namespace: 'qa'
                    serviceName: 'app-hola-mundo-service'
                    servicePort: 80
                    healthEndpoint: '/health'
                    maxRetries: 5
                    retryDelay: 10

  # Stage para crear tag automático cuando se hace merge a main
  - stage: CreateRelease
    displayName: 'Create Release Tag'
    dependsOn: ContainerBuild
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    variables:
      packageVersion: $[ stageDependencies.Build.BuildAndTest.outputs['setVersion.packageVersion'] ]
    jobs:
      - job: CreateTag
        displayName: 'Create Git Tag'
        steps:
          - checkout: self
            persistCredentials: true
            fetchDepth: 0

          - bash: |
              set -e

              VERSION="v$(packageVersion)"
              echo "Checking if tag ${VERSION} exists..."

              # Verificar si el tag ya existe
              if git tag -l | grep -q "^${VERSION}$"; then
                echo "##vso[task.logissue type=warning]Tag ${VERSION} already exists. Skipping tag creation."
                echo "##vso[task.setvariable variable=tagCreated;isOutput=true]false"
              else
                echo "Creating tag ${VERSION}..."
                git config user.email "azure-pipeline@devops.com"
                git config user.name "Azure Pipeline"
                git tag -a "${VERSION}" -m "Release ${VERSION} - Auto-generated from CI/CD pipeline"
                git push origin "${VERSION}"
                echo "##vso[task.logissue type=warning]Tag ${VERSION} created successfully!"
                echo "##vso[task.setvariable variable=tagCreated;isOutput=true]true"
                echo "##vso[task.setvariable variable=releaseVersion;isOutput=true]${VERSION}"
              fi
            name: createTag
            displayName: 'Create and Push Git Tag'

  - stage: DeployProd
    displayName: 'Deploy to Production'
    dependsOn: ContainerBuild
    condition: and(succeeded(), startsWith(variables['Build.SourceBranch'], 'refs/tags/v'))
    variables:
      imageTag: $[ stageDependencies.Build.BuildAndTest.outputs['setVersion.imageTag'] ]
    jobs:
      - deployment: DeployToEKSProd
        displayName: 'Deploy to Production EKS'
        environment: 'Production'
        strategy:
          runOnce:
            deploy:
              steps:
                - template: templates/k8s-deploy.yml@templates
                  parameters:
                    kubernetesServiceConnection: '$(kubernetesServiceConnection)'
                    namespace: 'production'
                    manifests: |
                      $(Pipeline.Workspace)/k8s/deployment.yaml
                      $(Pipeline.Workspace)/k8s/service.yaml
                    imageName: '$(ECR_REGISTRY)/$(imageName):$(imageTag)'

                - template: templates/connectivity-test.yml@templates
                  parameters:
                    kubernetesServiceConnection: '$(kubernetesServiceConnection)'
                    namespace: 'production'
                    serviceName: 'app-hola-mundo-service'
                    servicePort: 80
                    healthEndpoint: '/health'
                    maxRetries: 5
                    retryDelay: 10