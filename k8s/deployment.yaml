apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-hola-mundo
  labels:
    app: app-hola-mundo
    version: v1
spec:
  replicas: 3
  selector:
    matchLabels:
      app: app-hola-mundo
  template:
    metadata:
      labels:
        app: app-hola-mundo
        version: v1
    spec:
      containers:
      - name: app-hola-mundo
        image: ${ECR_REGISTRY}/app-hola-mundo:${BUILD_ID}
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
          name: http
          protocol: TCP
        env:
        - name: PORT
          value: "3000"
        - name: NODE_ENV
          value: "production"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
      securityContext:
        fsGroup: 1001
